<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mascot Booth player</title>
<link rel="stylesheet" href="/_cs/base.css">
<style>
  html.cs-alpha, html.cs-alpha body { background: transparent !important; } /* transparent renders: nothing behind the film */
  body.preview { background: #0b0c0f; display: grid; place-items: center; min-height: 100vh; }
  body.preview #stage-wrap { transform-origin: center; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: none; gap: 12px; align-items: center; padding: 10px 16px; background: #111318ee; color: #ddd; font: 13px ui-monospace, monospace; z-index: 9; }
  body.preview #bar { display: flex; }
  #bar input[type=range] { flex: 1; }
  #bar button { background: #FF783E; color: #111; border: 0; border-radius: 6px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div id="stage-wrap"><div id="stage"></div></div>
<div id="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="time">0.00s</span></div>
<script type="module">
  import { boot } from '/_cs/core.js';
  import * as lib from '/_cs/lib.js';
  const q = new URLSearchParams(location.search);
  const render = q.has('render');
  if (!render) document.body.classList.add('preview');
  if (q.has('alpha')) document.documentElement.classList.add('cs-alpha');
  window.__csPending = [];
  const cs = await boot('/film/', document.getElementById('stage'), lib);
  const fit = () => { if (render) return; const k = Math.min((innerWidth - 32) / cs.W, (innerHeight - 70) / cs.H); document.getElementById('stage-wrap').style.transform = `scale(${k})`; };
  fit(); addEventListener('resize', fit);
  window.__mascotBoothFilm = { duration: cs.duration, fps: cs.fps, width: cs.W, height: cs.H, sfx: cs.sfxList, seek: t => cs.seek(t), cs };
  // preview controls (audio follows the clock)
  const scrub = document.getElementById('scrub'), time = document.getElementById('time'), btn = document.getElementById('play');
  let audio = null;
  if (!render && cs.film.audio?.mix) { audio = new Audio('/film/' + cs.film.audio.mix); }
  else if (!render && cs.film.audio?.vo) { audio = new Audio('/film/' + cs.film.audio.vo); }
  let playing = false, t0 = 0, start = 0;
  const show = t => { cs.seek(t); scrub.value = Math.round(t / cs.duration * 1000); time.textContent = t.toFixed(2) + 's'; };
  const loop = () => { if (!playing) return; const t = audio ? audio.currentTime : t0 + (performance.now() - start) / 1000; if (t >= cs.duration) { playing = false; btn.textContent = 'Play'; return; } show(t); requestAnimationFrame(loop); };
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; if (playing) { t0 = scrub.value / 1000 * cs.duration; start = performance.now(); if (audio) { audio.currentTime = t0; audio.play(); } loop(); } else audio?.pause(); };
  scrub.oninput = () => { show(scrub.value / 1000 * cs.duration); if (audio) audio.currentTime = scrub.value / 1000 * cs.duration; };
  if (q.has('t')) show(+q.get('t'));
  document.title = 'ready';
</script>
</body>
</html>
